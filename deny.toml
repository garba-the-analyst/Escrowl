[advisories]
ignore = [
    # RUSTSEC-2025-0141 (bincode 1.3.3 unmaintained):
    # Required transitively by anchor-lang 0.31.1 and solana-program 2.2.1
    # (on-chain account/sysvar serialization). bincode 2.x is a breaking
    # rewrite the pinned Anchor/Solana stack does not support, and the SBF
    # toolchain (cargo 1.84) cannot resolve anything newer. No vulnerability,
    # maintenance-only advisory. Re-evaluate on Anchor/Solana upgrade.
    "RUSTSEC-2025-0141",
    # RUSTSEC-2025-0161 (libsecp256k1 0.6.0 unmaintained):
    # Required transitively by solana-secp256k1-recover 2.2.1
    # (cargo-deny itself reports "No safe upgrade is available").
    # Used only for secp256k1 signature recovery precompiles, never called
    # by escrowl instructions. No vulnerability, maintenance-only advisory.
    # Re-evaluate on Anchor/Solana upgrade.
    "RUSTSEC-2025-0161",
]

[licenses]
# MIT/Apache-2.0 cover our code and most of the Solana stack.
# (ISC was dropped: nothing in the tree declares it, and deny rejects
# unused allowances.)
# BSD-3-Clause: transitive via curve25519-dalek/subtle/ed25519 (audited,
# standard RustCrypto licensing) — required, no alternative.
# BSD-2-Clause: transitive via blake3/arrayref (hashing). OSI-approved,
# FSF-free permissive license — required, no alternative.
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Unicode-3.0",
]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
