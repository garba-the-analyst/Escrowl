[toolchain]
anchor_version = "0.31.2"
package_manager = "yarn"

[features]
resolution = true
skip-lint = false

[programs.devnet]
escrowl = "61YPTaqaVeh4dywJEFm21jLaRhHRqeiEiG1gGNox3zwE"

[programs.localnet]
escrowl = "61YPTaqaVeh4dywJEFm21jLaRhHRqeiEiG1gGNox3zwE"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "devnet"
wallet = "~/.config/solana/id.json"

[scripts]
deploy-devnet = "anchor deploy --provider.cluster devnet"
seed-devnet = "ts-node scripts/seed-devnet.ts"
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"
test-debug = "cargo test --manifest-path programs/escrowl/Cargo.toml --features anchor-test"

[test]
startup_wait = 20000
shutdown_wait = 2000
upgradeable = true
