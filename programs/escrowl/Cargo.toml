[package]
name = "escrowl"
version = "0.1.0"
description = "Milestone-based, dispute-aware SPL escrow protocol for Solana"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]
name = "escrowl"

[features]
default = []
anchor-test = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "=0.31.1"
anchor-spl = "=0.31.1"

[lints]
workspace = true
